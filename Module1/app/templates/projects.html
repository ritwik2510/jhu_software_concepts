{% extends "base.html" %}

{% block title %}Projects{% endblock %}

{% block content %}

<h1>Projects</h1>

{% for project in projects %}
<div class="project-block">
    <h2>{{ project.title }}</h2>
    <p>{{ project.overview }}</p>
    <p>
        GitHub:
        <a href="{{ project.github_url }}" target="_blank">
            Link to GitHub
        </a>
    </p>
    <p><em>What I learned:</em> {{ project.learned }}</p>
</div>
{% endfor %}

{% endblock %}
