name: Module 5 CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  lint:
    name: Pylint (10/10 required)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r Module5/requirements.txt
          pip install pylint

      - name: Run Pylint
        run: |
          pylint Module5/src --fail-under=10


  dependency_graph:
    name: Dependency Graph
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Graphviz
        run: |
          sudo apt-get update
          sudo apt-get install -y graphviz

      - name: Install dependencies
        run: |
          pip install -r Module5/requirements.txt
          pip install pydeps

      - name: Generate dependency graph
        run: |
          pydeps Module5/src/app.py -T svg -o Module5/dependency.svg

      - name: Verify dependency graph exists
        run: |
          test -f Module5/dependency.svg


  snyk:
    name: Snyk Dependency Scan
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Node (for Snyk)
        uses: actions/setup-node@v4
        with:
          node-version: "18"

      - name: Install Snyk
        run: npm install -g snyk

      - name: Install dependencies
        run: pip install -r Module5/requirements.txt

      - name: Run Snyk test
        run: snyk test --file=Module5/requirements.txt
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}


  pytest:
    name: Pytest Suite
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: gradcafe
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/gradcafe

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r Module5/requirements.txt
          pip install pytest pytest-cov

      - name: Create database schema
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -d gradcafe -c "
          CREATE TABLE IF NOT EXISTS applicants (
              id SERIAL PRIMARY KEY,
              program TEXT,
              comments TEXT,
              date_added TEXT,
              url TEXT,
              status TEXT,
              term TEXT,
              us_or_international TEXT,
              gpa FLOAT,
              gre INT,
              gre_v INT,
              gre_aw FLOAT,
              llm_generated_program TEXT,
              llm_generated_university TEXT
          );
          "

      - name: Run tests
        run: pytest Module5/tests -v