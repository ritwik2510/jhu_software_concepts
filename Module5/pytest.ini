[pytest]
addopts =
    -q
    --cov=src
    --cov-report=term-missing
    --cov-fail-under=100

markers =
    web: Flask route/page tests
    buttons: Pull Data and Update Analysis behavior
    analysis: formatting and analysis output tests
    db: database insert and query tests
    integration: end-to-end workflow tests
    data: data processing and utility tests