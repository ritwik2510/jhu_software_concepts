[pytest]
addopts =
    -q
    --cov=Module5/src
    --cov-report=term-missing
    --cov-report=html:Module5/htmlcov
    --cov-fail-under=100

markers =
    web: Flask route and page tests
    buttons: Pull Data and Update Analysis behavior tests
    analysis: Analysis formatting and output tests
    db: Database insert and query tests
    integration: End-to-end workflow tests