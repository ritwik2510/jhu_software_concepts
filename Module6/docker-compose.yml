services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: myuser
      POSTGRES_PASSWORD: mypassword
      POSTGRES_DB: mydatabase
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U myuser -d mydatabase"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - backend

  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - backend

  web:
    build:
      context: ./src/web
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgresql://myuser:mypassword@db:5432/mydatabase
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/%2F
      PYTHONPATH: /app
    volumes:
      - ./src:/app
    working_dir: /app/web
    command: python run.py
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - backend

  worker:
    build:
      context: ./src/worker
    environment:
      DATABASE_URL: postgresql://myuser:mypassword@db:5432/mydatabase
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/%2F
      PYTHONPATH: /app
    volumes:
      - ./src:/app
    working_dir: /app/worker
    command: python consumer.py
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - backend

volumes:
  db_data:

networks:
  backend: